name: Sync Carbon tree-sitter files

on:
  schedule:
    - cron: "17 0 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-carbon-tree-sitter
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install development tools
        uses: jdx/mise-action@v5.1.2

      - name: Install Carbon dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev lld libunwind-dev

      - name: Clone carbon-lang
        run: git clone --depth 1 https://github.com/carbon-language/carbon-lang.git "$RUNNER_TEMP/carbon-lang"

      - name: Build parser files
        working-directory: ${{ runner.temp }}/carbon-lang
        run: ./scripts/run_bazelisk.py build //utils/tree_sitter:parser --strategy=Genrule=local --action_env=PATH

      - name: Replace generated files
        run: |
          rsync -a --delete \
            "$RUNNER_TEMP/carbon-lang/utils/tree_sitter/src/" \
            "$GITHUB_WORKSPACE/src/"
          rsync -a --delete \
            "$RUNNER_TEMP/carbon-lang/utils/tree_sitter/grammar.js" \
            "$GITHUB_WORKSPACE/grammar.js"

      - name: Patch scanner include
        run: |
          if [[ ! -f src/scanner.c ]]; then
            echo "No external scanner to patch."
          elif grep -Eq '^[[:space:]]*#include[[:space:]]*"utils/tree_sitter/src/tree_sitter/parser\.h"[[:space:]]*$' src/scanner.c; then
            sed -Ei 's|^[[:space:]]*#include[[:space:]]*"utils/tree_sitter/src/tree_sitter/parser\.h"[[:space:]]*$|#include "./tree_sitter/parser.h"|' src/scanner.c
          elif grep -Eq '^[[:space:]]*#include[[:space:]]*"(\./)?tree_sitter/parser\.h"[[:space:]]*$' src/scanner.c; then
            echo "Scanner already uses the local parser header."
          else
            echo "scanner.c uses an unexpected parser header include." >&2
            exit 1
          fi

      - name: Generate parser files
        run: |
          tree-sitter generate

      - name: Validate generated parser
        run: tree-sitter parse --grammar-path . --quiet tests/fixtures/example.carbon

      - name: Upload generated files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: generated-parser
          path: |
            grammar.js
            src/
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Download generated files
        uses: actions/download-artifact@v8.0.1
        with:
          name: generated-parser
          path: ${{ runner.temp }}/generated-parser

      - name: Replace generated files
        run: |
          test -f "$RUNNER_TEMP/generated-parser/grammar.js"
          test -f "$RUNNER_TEMP/generated-parser/src/parser.c"
          test -f "$RUNNER_TEMP/generated-parser/src/tree_sitter/parser.h"

          if find "$RUNNER_TEMP/generated-parser" -type l -print -quit | grep -q .; then
            echo "Generated artifact contains an unexpected symbolic link." >&2
            exit 1
          fi

          rsync -a --delete \
            "$RUNNER_TEMP/generated-parser/src/" \
            "$GITHUB_WORKSPACE/src/"
          rsync -a \
            "$RUNNER_TEMP/generated-parser/grammar.js" \
            "$GITHUB_WORKSPACE/grammar.js"

      - name: Commit sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- grammar.js src/
          if git diff --cached --quiet; then
            echo "No parser file changes to commit."
          else
            git commit -m "Sync tree-sitter parser files from carbon-lang"
            git push
          fi
